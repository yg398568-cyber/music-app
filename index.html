<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مشغل أغاني ياسر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1e1530">
</head>
<body>
<main>
  <section class="page on" id="p-songs">
    <h1>الأغاني</h1>
    <input type="search" id="search" placeholder="🔎 دوّر على أغنية أو فنان">
    <div class="msg" id="msg"></div>
    <ul id="songs"></ul>
  </section>

  <section class="page" id="p-player">
    <div class="disc" id="disc"></div>
    <div class="title" id="title">اختار أغنية</div>
    <div class="sub" id="artist"></div>
    <div class="bar"><span id="cur">0:00</span><input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="شريط التقدم"><span id="dur">0:00</span></div>
    <div class="ctl">
      <button id="shuf" aria-label="عشوائي">🔀</button>
      <button id="prev" aria-label="السابق">⏮</button>
      <button id="play" aria-label="تشغيل">▶</button>
      <button id="next" aria-label="التالي">⏭</button>
      <button id="rep" aria-label="تكرار">🔁</button>
    </div>
    <div class="ctl"><button id="fav" aria-label="مفضلة">🤍</button></div>
  </section>

  <section class="page" id="p-favs">
    <h1>المفضلة ❤️</h1>
    <ul id="favlist"></ul>
  </section>

  <section class="page" id="p-settings">
    <h1>الإعدادات</h1>
    <div class="card"><h2>🎨 المظهر</h2><div class="seg" id="seg-theme"></div></div>
    <div class="card"><h2>⏩ سرعة التشغيل</h2><div class="seg" id="seg-speed"></div></div>
    <div class="card"><h2>😴 مؤقت النوم</h2><div class="seg" id="seg-sleep"></div><div class="msg" id="sleepinfo"></div></div>
    <div class="card"><h2>🎵 الأغاني</h2>
      <button class="big" id="scan">🔍 دوّر على أغاني جهازك</button>
      <label class="big alt" id="addl">+ ضيف ملفات بنفسك<input type="file" id="files" accept="audio/*" multiple hidden></label>
    </div>
  </section>
</main>

<div id="mini" hidden><span id="mtitle"></span><button id="mplay" aria-label="تشغيل">▶</button></div>

<nav>
  <button data-tab="songs" class="on"><i>🎵</i>الأغاني</button>
  <button data-tab="player"><i>▶️</i>التشغيل</button>
  <button data-tab="favs"><i>❤️</i>المفضلة</button>
  <button data-tab="settings"><i>⚙️</i>الإعدادات</button>
</nav>
<script src="script.js"></script>
</body>
</html>
